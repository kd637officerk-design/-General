name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Patch Android project
        run: |
          PKG=android/app/src/main/java/com/aeterna/vitrix
          mkdir -p $PKG
          cp native/LocalMusicPlugin.java $PKG/
          cat > $PKG/MainActivity.java <<'JAVA'
          package com.aeterna.vitrix;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              registerPlugin(LocalMusicPlugin.class);
              super.onCreate(b);
            }
          }
          JAVA
          python3 - <<'PY'
          import re,glob,shutil,os
          m='android/app/src/main/AndroidManifest.xml'
          s=open(m).read()
          perms=''.join('<uses-permission android:name="android.permission.%s"/>\n'%p for p in ['READ_MEDIA_AUDIO','READ_MEDIA_VIDEO','READ_MEDIA_IMAGES','READ_EXTERNAL_STORAGE','WRITE_EXTERNAL_STORAGE','MANAGE_EXTERNAL_STORAGE','FOREGROUND_SERVICE','FOREGROUND_SERVICE_MEDIA_PLAYBACK','POST_NOTIFICATIONS','WAKE_LOCK'])
          s=s.replace('<application',perms+'<application android:requestLegacyExternalStorage="true"',1)
          open(m,'w').write(s)
          res='android/app/src/main/res'
          for d in glob.glob(res+'/mipmap-anydpi*'): shutil.rmtree(d)
          for d in glob.glob('resources/mipmap-*'):
              dst=res+'/'+os.path.basename(d); os.makedirs(dst,exist_ok=True)
              for f in glob.glob(d+'/*.png'): shutil.copy(f,dst)
          open(res+'/values/bgdark.xml','w').write('<resources><color name="bgdark">#0a0c0f</color></resources>')
          st=res+'/values/styles.xml'
          t=open(st).read().replace('@drawable/splash','@color/bgdark')
          t=re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)',r'\1<item name="android:windowBackground">@color/bgdark</item>',t)
          open(st,'w').write(t)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AETERNA-VITRIX-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
